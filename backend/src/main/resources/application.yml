server:
  port: 8081

spring:
  config:
    import: optional:file:../.env
  application:
    name: pkm-backend

  datasource:
    url: jdbc:postgresql://pkm-db.cxa0822agcne.eu-north-1.rds.amazonaws.com:5432/postgres
    username: pkm_user
    password: Purvank123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-gen
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-please-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
