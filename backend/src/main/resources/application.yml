server:
  port: 8081

spring:
  config:
    import: optional:file:../.env
  application:
    name: pkm-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:pkm_user}
    password: ${DB_PASSWORD:pkm_local_pw}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-gen
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-please-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
