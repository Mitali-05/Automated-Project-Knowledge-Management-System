server:
  port: 8081

spring:
  application:
    name: pkm-backend

  datasource:
    url: jdbc:h2:file:./data/pkm_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-gen
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-please-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
