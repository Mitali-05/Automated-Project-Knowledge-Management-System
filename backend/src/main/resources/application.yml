server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: pkm-backend
  # Convenience for local development: load key=value pairs from a .env file
  # (repo root or backend/ folder). Real environment variables always win.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      validation-timeout: 2500
      keepalive-time: 30000
      max-lifetime: 600000
      idle-timeout: 300000
      minimum-idle: 2
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # the schema is owned by Flyway migrations, never by Hibernate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.pkm: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # REQUIRED. 32+ random characters, e.g. `openssl rand -base64 48`. The app refuses to start without it.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}   # 8 hours
  rate-limit:
    # Max login / signup / join-organization POSTs per client address per minute (then HTTP 429).
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  github:
    app-id: ${GITHUB_APP_ID:}
    app-slug: ${GITHUB_APP_SLUG:}
    private-key-base64: ${GITHUB_APP_PRIVATE_KEY_BASE64:}
    client-id: ${GITHUB_APP_CLIENT_ID:}
    client-secret: ${GITHUB_APP_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI}
  ingest:
    service-key: ${INGEST_SERVICE_KEY:}
  jira:
    client-id: ${JIRA_CLIENT_ID:}
    client-secret: ${JIRA_CLIENT_SECRET:}
    redirect-uri: ${JIRA_REDIRECT_URI:}
    token-encryption-key: ${JIRA_TOKEN_ENCRYPTION_KEY:}
  extractor:
    python-path: ${EXTRACTOR_PYTHON_PATH:}
    working-dir: ${EXTRACTOR_WORKING_DIR:}
    poll-seconds: ${PRISM_POLL_SECONDS:2}
    auto-start: ${EXTRACTOR_AUTO_START:false}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
