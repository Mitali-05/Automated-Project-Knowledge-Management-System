server:
  port: 8081

spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: pkm-backend

  ai:
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: ${GEMINI_BASE_URL}
      chat:
        options:
          model: ${GEMINI_MODEL}
          temperature: 0.1

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-gen
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

app:
  github:
    token: ${GITHUB_TOKEN:}
    app-id: ${GITHUB_APP_ID:}
    private-key-base64: ${GITHUB_APP_PRIVATE_KEY_BASE64:}
    app-slug: ${GITHUB_APP_SLUG:}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}   # 24h
