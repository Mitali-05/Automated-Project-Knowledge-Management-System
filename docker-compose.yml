# Local development database only. Staging/production use AWS RDS (see README).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pkm-postgres-local
    environment:
      POSTGRES_DB: pkm_dev
      POSTGRES_USER: pkm_user
      POSTGRES_PASSWORD: pkm_local_pw
    ports:
      - "5432:5432"
    volumes:
      - pkm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkm_user -d pkm_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pkm_pg_data:
